name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source-backed engineering stack
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun 1.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
          components: rustfmt,clippy,llvm-tools-preview

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/nodspice
            vendor/firmverse
            vendor/hardware-wallet/demos/browser-wallet

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build Elements physical twin
        working-directory: vendor/elements
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build NodeSpice Rust/WASM power model
        working-directory: vendor/nodspice
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Firmverse browser emulator
        working-directory: vendor/firmverse
        run: bash tools/build_web.sh

      - name: Build reducer-driven Cortex-M wallet firmware
        working-directory: vendor/hardware-wallet
        run: bash tools/build_browser_wallet_demo.sh

      - name: Publish source-backed labs
        run: |
          rm -rf public/labs/nodspice public/labs/wallet-twin
          mkdir -p public/labs/nodspice public/labs/wallet-twin
          cp -R vendor/nodspice/dist/. public/labs/nodspice/
          cp vendor/firmverse/web/dist/firmverse.wasm public/labs/wallet-twin/
          cp vendor/firmverse/web/dist/engine-worker.js public/labs/wallet-twin/
          cp vendor/hardware-wallet/demos/browser-wallet/dist/wallet-demo.hex public/labs/wallet-twin/
          cat > public/labs/wallet-twin/sources.json <<'JSON'
          {
            "hardwareWallet": "6244f8d76be1fdb509f6d206be77de729d360fdf",
            "firmverse": "e76dbed175546210d45c4382dfcde3cc1629066a",
            "elements": "23a0c5491f25e5516af3f5bd0d24684731a2600b",
            "nodspice": "ab178761fae72840a24fe5ac879a7852bcfac6b8"
          }
          JSON

      - name: Execute the firmware inside Firmverse WASM
        run: node scripts/verify-wallet-twin.mjs

      - name: Install Anatomy dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Remotion GIF compositions
        run: npm run motion:check

      - name: Render looped concept GIFs
        run: npm run motion:gifs

      - name: Build Astro site
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
