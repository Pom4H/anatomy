name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source-backed engineering stack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun 1.4
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
          components: rustfmt,clippy,llvm-tools-preview

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/nodspice
            vendor/firmverse
            vendor/hardware-wallet/demos/browser-wallet

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Verify exact source revisions
        run: |
          set -euo pipefail
          test "$(git -C vendor/hardware-wallet rev-parse HEAD)" = e8d23c7755eb6ca161a335930725461046aec6ce
          test "$(git -C vendor/firmverse rev-parse HEAD)" = 17926a8b32ef452824bf3cee10c5eacdba6853d8
          test "$(git -C vendor/elements rev-parse HEAD)" = 7b7af14135a427014875eb217d4e18ddc88bc7cf
          test "$(git -C vendor/nodspice rev-parse HEAD)" = 9a7edda4d8a4c9cb9bb59fb1fe851b94c36576f2

      - name: Build Elements physical twin
        working-directory: vendor/elements
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build NodeSpice active and WFI power model
        working-directory: vendor/nodspice
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build Firmverse browser emulator with atomic GPIO input
        working-directory: vendor/firmverse
        run: bash tools/build_web.sh

      - name: Build two-button Cortex-M wallet OS
        working-directory: vendor/hardware-wallet
        run: bash tools/build_browser_wallet_demo.sh

      - name: Publish source-backed labs
        run: |
          set -euo pipefail
          rm -rf public/labs/nodspice public/labs/wallet-twin
          mkdir -p public/labs/nodspice public/labs/wallet-twin
          cp -R vendor/nodspice/dist/. public/labs/nodspice/
          cp vendor/firmverse/web/dist/firmverse.wasm public/labs/wallet-twin/
          cp vendor/firmverse/web/dist/engine-worker.js public/labs/wallet-twin/
          cp vendor/hardware-wallet/demos/browser-wallet/dist/wallet-demo.hex public/labs/wallet-twin/
          cat > public/labs/wallet-twin/sources.json <<'JSON'
          {
            "hardwareWallet": "e8d23c7755eb6ca161a335930725461046aec6ce",
            "firmverse": "17926a8b32ef452824bf3cee10c5eacdba6853d8",
            "elements": "7b7af14135a427014875eb217d4e18ddc88bc7cf",
            "nodspice": "9a7edda4d8a4c9cb9bb59fb1fe851b94c36576f2"
          }
          JSON

      - name: Prove onboarding WFI wake and chord signing in Firmverse WASM
        run: node scripts/verify-wallet-twin.mjs

      - name: Install Anatomy dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Remotion GIF compositions
        run: npm run motion:check

      - name: Render looped concept GIFs
        run: npm run motion:gifs

      - name: Build Astro site
        run: npm run build

      - name: Prove the assembled wallet OS in Chrome
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME"
          rm -rf .proof-root
          mkdir -p .proof-root
          ln -s "$PWD/dist" .proof-root/anatomy
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .proof-root >/tmp/anatomy-proof-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:4173/anatomy/hardware-wallet/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          node scripts/prove-wallet-browser.mjs \
            "$CHROME" \
            'http://127.0.0.1:4173/anatomy/hardware-wallet/'

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
