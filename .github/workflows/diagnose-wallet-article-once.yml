name: Diagnose rewritten wallet article once

on:
  push:
    paths:
      - .github/workflows/diagnose-wallet-article-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin and build the Elements package
        shell: bash
        run: |
          set -euo pipefail
          git -C vendor/elements fetch --quiet origin 7b7af14135a427014875eb217d4e18ddc88bc7cf
          git -C vendor/elements checkout --quiet --detach 7b7af14135a427014875eb217d4e18ddc88bc7cf

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Build local Elements dependency
        working-directory: vendor/elements
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Capture install, motion, and Astro diagnostics
        id: diagnose
        shell: bash
        run: |
          set +e
          : > /tmp/wallet-article-diagnostic.full.log
          echo '=== npm install ===' >> /tmp/wallet-article-diagnostic.full.log
          npm install --no-audit --no-fund >> /tmp/wallet-article-diagnostic.full.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo '=== npm run motion:check ===' >> /tmp/wallet-article-diagnostic.full.log
            npm run motion:check >> /tmp/wallet-article-diagnostic.full.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo '=== npm run build ===' >> /tmp/wallet-article-diagnostic.full.log
            npm run build >> /tmp/wallet-article-diagnostic.full.log 2>&1
            status=$?
          fi
          {
            echo "exit_status=$status"
            echo
            tail -n 260 /tmp/wallet-article-diagnostic.full.log
          } > wallet-article-diagnostic.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat wallet-article-diagnostic.log
          exit 0

      - name: Commit diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wallet-article-diagnostic.log
          git commit -m "Capture wallet article build diagnostics"
          git pull --rebase origin main
          git push origin main

      - name: Preserve failure status
        if: steps.diagnose.outputs.status != '0'
        run: exit 1
