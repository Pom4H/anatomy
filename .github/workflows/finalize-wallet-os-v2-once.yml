name: Finalize Astro-rendered wallet OS once

on:
  push:
    paths:
      - .github/workflows/finalize-wallet-os-v2-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-astro-wallet-os-once
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout lesson and all source-backed layers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Pin the exact proven revisions
        shell: bash
        run: |
          set -euo pipefail
          pin() {
            local path="$1"
            local sha="$2"
            git -C "$path" fetch --quiet origin "$sha"
            git -C "$path" checkout --quiet --detach "$sha"
            test "$(git -C "$path" rev-parse HEAD)" = "$sha"
          }
          pin vendor/hardware-wallet d0dfd9652913cb93318e6ae9701ba2718a97bd45
          pin vendor/firmverse 17926a8b32ef452824bf3cee10c5eacdba6853d8
          pin vendor/elements 7b7af14135a427014875eb217d4e18ddc88bc7cf
          pin vendor/nodspice 9a7edda4d8a4c9cb9bb59fb1fe851b94c36576f2

      - name: Make the Astro component the only final device
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          article = Path('src/content/articles/hardware-wallet.md')
          source = article.read_text()
          marker = '\n<section class="device-lab device-lab--assembled"'
          if marker in source:
              source = source[:source.index(marker)].rstrip() + '\n'
          if '<ee-hardware-wallet' in source or 'data-wallet-enter' in source:
              raise SystemExit('raw interactive device markup remains inside Markdown')
          if '## The assembled device' not in source:
              raise SystemExit('final assembled-device lesson section is missing')
          article.write_text(source)

          exact = {
              'hardware_wallet_full': 'd0dfd9652913cb93318e6ae9701ba2718a97bd45',
              'hardware_wallet_short': 'd0dfd9',
              'firmverse_full': '17926a8b32ef452824bf3cee10c5eacdba6853d8',
              'elements_full': '7b7af14135a427014875eb217d4e18ddc88bc7cf',
              'nodspice_full': '9a7edda4d8a4c9cb9bb59fb1fe851b94c36576f2',
          }
          paths = [
              Path('.github/workflows/deploy.yml'),
              article,
              Path('src/layouts/ArticleLayout.astro'),
              Path('src/scripts/hardware-wallet-device.ts'),
              Path('scripts/verify-wallet-twin.mjs'),
              Path('scripts/prove-wallet-browser.mjs'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace('e8d23c7755eb6ca161a335930725461046aec6ce', exact['hardware_wallet_full'])
              text = text.replace('e8d23c', exact['hardware_wallet_short'])
              text = text.replace(
                  'HW d0dfd9 · FV atomic GPIO · EL 7b7af1 · NS power-state',
                  'HW d0dfd9 · FV 17926a8 · EL 7b7af1 · NS 9a7edda',
              )
              path.write_text(text)

          component = Path('src/components/WalletOsAssembly.astro')
          component_source = component.read_text()
          required = [
              '<ee-hardware-wallet',
              'data-wallet-left',
              'data-wallet-enter',
              'data-wallet-right',
              'data-wallet-control',
              'data-wallet-reset',
              'data-wallet-circuit',
          ]
          missing = [needle for needle in required if needle not in component_source]
          if missing:
              raise SystemExit(f'Astro wallet assembly is incomplete: {missing}')

          deploy = Path('.github/workflows/deploy.yml').read_text()
          for sha in (
              exact['hardware_wallet_full'],
              exact['firmverse_full'],
              exact['elements_full'],
              exact['nodspice_full'],
          ):
              if sha not in deploy:
                  raise SystemExit(f'deploy workflow does not pin {sha}')

          verify = Path('scripts/verify-wallet-twin.mjs').read_text()
          for sha in (
              exact['hardware_wallet_full'],
              exact['firmverse_full'],
              exact['elements_full'],
              exact['nodspice_full'],
          ):
              if sha not in verify:
                  raise SystemExit(f'direct proof does not pin {sha}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun 1.4
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown,thumbv6m-none-eabi
          components: rustfmt,clippy,llvm-tools-preview

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Verify and build the physical device twin
        working-directory: vendor/elements
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test
          bun run build

      - name: Verify and build the active and WFI circuit
        working-directory: vendor/nodspice
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          bun test
          bun run build

      - name: Verify and build Firmverse GPIO wake runtime
        working-directory: vendor/firmverse
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          bash tools/build_web.sh
          node web/smoke.mjs web/dist/firmverse.wasm

      - name: Verify and build the two-button Cortex-M wallet OS
        working-directory: vendor/hardware-wallet
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace
          cargo +1.98.0 check --locked --workspace --no-default-features
          bash tools/build_browser_wallet_demo.sh

      - name: Assemble exact browser artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/labs/nodspice public/labs/wallet-twin
          mkdir -p public/labs/nodspice public/labs/wallet-twin
          cp -R vendor/nodspice/dist/. public/labs/nodspice/
          cp vendor/firmverse/web/dist/firmverse.wasm public/labs/wallet-twin/
          cp vendor/firmverse/web/dist/engine-worker.js public/labs/wallet-twin/
          cp vendor/hardware-wallet/demos/browser-wallet/dist/wallet-demo.hex public/labs/wallet-twin/
          cat > public/labs/wallet-twin/sources.json <<'JSON'
          {
            "hardwareWallet": "d0dfd9652913cb93318e6ae9701ba2718a97bd45",
            "firmverse": "17926a8b32ef452824bf3cee10c5eacdba6853d8",
            "elements": "7b7af14135a427014875eb217d4e18ddc88bc7cf",
            "nodspice": "9a7edda4d8a4c9cb9bb59fb1fe851b94c36576f2"
          }
          JSON

      - name: Prove onboarding WFI GPIO wake and chord signing directly
        run: node scripts/verify-wallet-twin.mjs

      - name: Build the rewritten Astro lesson
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run motion:check
          npm run build

      - name: Prove the final device and circuit in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME"
          rm -rf .proof-root
          mkdir -p .proof-root
          ln -s "$PWD/dist" .proof-root/anatomy
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .proof-root >/tmp/anatomy-proof-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:4173/anatomy/hardware-wallet/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          node scripts/prove-wallet-browser.mjs \
            "$CHROME" \
            'http://127.0.0.1:4173/anatomy/hardware-wallet/'

      - name: Commit only the completely proven assembly
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-wallet-os-once.yml
          rm .github/workflows/finalize-wallet-os-v2-once.yml
          rm -rf public/labs .proof-root dist
          rm -f package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            .github/workflows/finalize-wallet-os-once.yml \
            .github/workflows/finalize-wallet-os-v2-once.yml \
            .github/workflows/deploy.yml \
            src/components/WalletOsAssembly.astro \
            src/content/articles/hardware-wallet.md \
            src/layouts/ArticleLayout.astro \
            src/scripts/hardware-wallet-device.ts \
            scripts/verify-wallet-twin.mjs \
            scripts/prove-wallet-browser.mjs \
            vendor/hardware-wallet \
            vendor/firmverse \
            vendor/elements \
            vendor/nodspice
          git diff --cached --quiet && exit 0
          git commit -m "Ship the Astro-rendered two-button wallet OS lesson"
          git pull --rebase origin main
          git push origin main
