name: Fix wallet article schema once

on:
  push:
    paths:
      - .github/workflows/fix-wallet-article-schema-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Shorten schema-bound SEO description and clean diagnostics
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/content/articles/hardware-wallet.md')
          source = path.read_text()
          old = 'description: "Build the mental model of a hardware-wallet operating system: first boot, PIN entry, recovery words, settings, trusted transaction review, sleep, GPIO wake, firmware emulation, and the power circuit beneath the device."'
          new = 'description: "A hardware-wallet OS from first boot to signing: PIN, 24-word backup, settings, trusted review, Cortex-M sleep, GPIO wake, Firmverse, and NodeSpice."'
          if source.count(old) != 1:
              raise SystemExit(f'expected one description anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          rm -f wallet-article-diagnostic.log
          rm -f .github/workflows/diagnose-wallet-article-once.yml
          rm .github/workflows/fix-wallet-article-schema-once.yml
      - name: Commit schema fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix wallet lesson content schema"
          git pull --rebase origin main
          git push origin main
