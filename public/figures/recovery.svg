<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Wallet recovery</title><desc id="desc">The same recovery material can restore a deterministic wallet on replacement hardware or compatible software.</desc>
<rect width="1600" height="900" fill="#e8e1d4"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#171713}
.title{font-size:56px;font-weight:760;letter-spacing:-2px} .label{font-size:26px;font-weight:700} .body{font-size:21px} .small{font-size:17px;fill:#625e56} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px} .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;fill:#d3492f}
.line{fill:none;stroke:#171713;stroke-width:3} .red{fill:none;stroke:#d3492f;stroke-width:5}
</style><text x="70" y="100" class="title">The device is replaceable. The backup is authority.</text><rect x="80" y="260" width="350" height="230" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="108" y="306" class="label">RECOVERY BACKUP</text><text x="108" y="342" class="small">root secret</text><text x="108" y="369" class="small">kept offline</text><text x="108" y="396" class="small">independent of the device</text><path d="M430 335L700 250" class="red" marker-end="url(#arrowRed)"/><path d="M430 400L700 600" class="red" marker-end="url(#arrowRed)"/><rect x="700" y="170" width="360" height="190" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="728" y="216" class="label">REPLACEMENT HARDWARE</text><text x="728" y="252" class="small">derive the same wallet</text><text x="728" y="279" class="small">continue signing</text><rect x="700" y="540" width="360" height="190" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="728" y="586" class="label">COMPATIBLE SOFTWARE</text><text x="728" y="622" class="small">derive the same wallet</text><text x="728" y="649" class="small">emergency recovery</text><path d="M1060 265L1260 265" class="line" marker-end="url(#arrow)"/><path d="M1060 635L1260 635" class="line" marker-end="url(#arrow)"/><rect x="1260" y="190" width="260" height="150" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="1288" y="236" class="label">SAME ACCOUNTS</text><text x="1288" y="272" class="small">same paths</text><text x="1288" y="299" class="small">same keys</text><rect x="1260" y="560" width="260" height="150" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="1288" y="606" class="label">SAME ACCOUNTS</text><text x="1288" y="642" class="small">same paths</text><text x="1288" y="669" class="small">same keys</text><path d="M255 490V780H1520" stroke="#d3492f" stroke-width="3" stroke-dasharray="12 10" fill="none"/><text x="80" y="825" class="body">A stolen backup can take the same 