<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">One parsed transaction feeds both trusted review and signing</title>
  <desc id="desc">A hostile PSBT enters a trusted parser. The normalized transaction branches to a trusted display and to sighash computation. Physical approval gates the signing key and only the signature leaves.</desc>
  <rect width="960" height="540" fill="#e8e1d4"/>
  <text x="54" y="54" font-family="ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="1.3" fill="#171713">WHAT YOU SEE = WHAT YOU SIGN</text>
  <line x1="54" y1="78" x2="906" y2="78" stroke="#171713"/>

  <g font-family="ui-sans-serif, system-ui">
    <rect x="54" y="190" width="160" height="112" fill="#dfe8f1" stroke="#3e6d9c"/>
    <text x="74" y="225" font-size="12" font-family="ui-monospace, monospace" fill="#3e6d9c">UNTRUSTED</text>
    <text x="74" y="258" font-size="24" font-weight="700" fill="#171713">PSBT</text>
    <text x="74" y="282" font-size="13" fill="#5d5a52">host proposal</text>

    <rect x="276" y="166" width="186" height="160" fill="#f2eee4" stroke="#171713" stroke-width="2"/>
    <text x="298" y="205" font-size="12" font-family="ui-monospace, monospace" fill="#9e2c19">TRUSTED</text>
    <text x="298" y="240" font-size="24" font-weight="700" fill="#171713">Parser</text>
    <text x="298" y="270" font-size="13" fill="#5d5a52">validate policy</text>
    <text x="298" y="292" font-size="13" fill="#5d5a52">normalize transaction</text>

    <rect x="542" y="112" width="188" height="118" fill="#f4e4c7" stroke="#c88926"/>
    <text x="562" y="146" font-size="12" font-family="ui-monospace, monospace" fill="#8a5a14">HUMAN REVIEW</text>
    <text x="562" y="178" font-size="21" font-weight="700" fill="#171713">Trusted display</text>
    <text x="562" y="202" font-size="13" fill="#5d5a52">amount · address · fee</text>

    <rect x="542" y="286" width="188" height="118" fill="#edf0e8" stroke="#627d45"/>
    <text x="562" y="320" font-size="12" font-family="ui-monospace, monospace" fill="#4a6234">CRYPTOGRAPHY</text>
    <text x="562" y="352" font-size="21" font-weight="700" fill="#171713">Sighash</text>
    <text x="562" y="376" font-size="13" fill="#5d5a52">derived locally</text>

    <rect x="784" y="238" width="122" height="112" fill="#171713"/>
    <text x="804" y="272" font-size="12" font-family="ui-monospace, monospace" fill="#b8d18d">GATED</text>
    <text x="804" y="304" font-size="21" font-weight="700" fill="#f2eee4">Signer</text>
    <text x="804" y="328" font-size="13" fill="#bdb5a7">signature only</text>
  </g>

  <g fill="none" stroke-width="2">
    <path d="M214 246h62" stroke="#3e6d9c"/>
    <path d="M462 226C500 226 504 171 542 171" stroke="#c88926"/>
    <path d="M462 266C500 266 504 345 542 345" stroke="#627d45"/>
    <path d="M730 345h54" stroke="#627d45"/>
  </g>
  <g fill="#3e6d9c"><path d="M270 241l10 5-10 5z"/></g>
  <g fill="#c88926"><path d="M536 166l10 5-10 5z"/></g>
  <g fill="#627d45"><path d="M536 340l10 5-10 5z"/><path d="M778 340l10 5-10 5z"/></g>

  <g>
    <rect x="582" y="244" width="110" height="28" rx="14" fill="#c88926"/>
    <text x="637" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#171713">PHYSICAL OK</text>
    <path d="M692 258H846v-20" fill="none" stroke="#c88926" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <line x1="54" y1="446" x2="906" y2="446" stroke="#171713"/>
  <g font-family="ui-monospace, monospace" font-size="11">
    <text x="54" y="478" fill="#5d5a52">HOST MAY PROPOSE</text>
    <text x="356" y="478" text-anchor="middle" fill="#9e2c19">DEVICE INTERPRETS</text>
    <text x="636" y="478" text-anchor="middle" fill="#8a5a14">HUMAN AUTHORIZES</text>
    <text x="906" y="478" text-anchor="end" fill="#4a6234">SIGNER EFFECTS</text>
  </g>
</svg>