555H945" class="line"/><rect x="700" y="590" width="220" height="120" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="728" y="636" class="label">m/44&#x27;/0&#x27;/0&#x27;</text><text x="728" y="672" class="small">account 0</text><rect x="950" y="590" width="220" height="120" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="978" y="636" class="label">m/44&#x27;/0&#x27;/1&#x27;</text><text x="978" y="672" class="small">account 1</text><rect x="1200" y="590" width="220" height="120" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="1228" y="636" class="label">…</text><text x="1228" y="672" class="small">more branches</text><text x="70" y="805" class="body">Re-entering the same recovery material reproduces the same tree—if the wallet uses compatible standards and paths.</text></svg>