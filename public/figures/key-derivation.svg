<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Deterministic wallet derivation</title><desc id="desc">Entropy becomes recovery words, a seed, a hierarchical key tree, and many accounts and addresses.</desc>
<rect width="1600" height="900" fill="#e8e1d4"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker>
</defs>
<style>
