<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">What a wallet actually controls</title><desc id="desc">Assets remain on the blockchain ledger while the wallet controls keys and produces signatures.</desc>
<rect width="1600" height="900" fill="#e8e1d4"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#171713}
.title{font-size:56px;font-weight:760;letter-spacing:-2px} .label{font-size:26px;font-weight:700} .body{font-size:21px} .small{font-size:17px;fill:#625e56} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px} .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;fill:#d3492f}
.line{fill:none;stroke:#171713;stroke-width:3} .red{fill:none;stroke:#d3492f;stroke-width:5}
</style><text x="70" y="100" class="title">A wallet does not hold coins</text><text x="70" y="142" class="small">It connects human intent to cryptographic authorization.</text><rect x="80" y="260" width="400" height="300" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="108" y="306" class="label">WALLET</text><text x="108" y="342" class="small">private keys</text><text x="108" y="369" class="small">account metadata</text><text x="108" y="396" class="small">transaction builder</text><text x="108" y="423" class="small">trusted approval</text><text x="112" y="615" class="mono">SECRET AUTHORITY</text><path d="M480 410L720 410" class="red" marker-end="url(#arrowRed)"/><text x="545" y="375" class="label">SIGNATURE</text><text x="545" y="445" class="small">authorizes specific data</text><rect x="720" y="220" width="800" height="390" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="748" y="266" class="label">BLOCKCHAIN LEDGER</text><text x="748" y="302" class="small">balances / UTXOs</text><text x="748" y="329" class="small">ownership conditions</text><text x="748" y="356" class="small">transaction history</text><text x="748" y="383" class="small">shared protocol state</text><path d="M780 520H1450" stroke="#a49b8d" stroke-width="2"/><text x="780" y="565" class="mono">PUBLIC, REPLICATED, VERIFIED BY NODES</text><text x="80" y="805" class="num">01</text><text x="125" y="805" class="body">The wallet holds the ability to authorize. The network holds the record everyone agrees on.</text></svg>