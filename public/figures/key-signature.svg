<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Keys, addresses, and signatures</title><desc id="desc">A private key derives a public key and address and signs transaction data.</desc>
<rect width="1600" height="900" fill="#e8e1d4"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#171713}
.title{font-size:56px;font-weight:760;letter-spacing:-2px} .label{font-size:26px;font-weight:700} .body{font-size:21px} .small{font-size:17px;fill:#625e56} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px} .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;fill:#d3492f}
.line{fill:none;stroke:#171713;stroke-width:3} .red{fill:none;stroke:#d3492f;stroke-width:5}
</style><text x="70" y="100" class="title">One secret, two public artifacts</text><rect x="80" y="270" width="330" height="220" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="108" y="316" class="label">PRIVATE KEY</text><text x="108" y="352" class="small">secret</text><text x="108" y="379" class="small">used only for signing</text><path d="M410 330L650 250" class="line" marker-end="url(#arrow)"/><path d="M410 430L650 570" class="red" marker-end="url(#arrowRed)"/><rect x="650" y="170" width="360" height="190" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="678" y="216" class="label">PUBLIC KEY</text><text x="678" y="252" class="small">shareable</text><text x="678" y="279" class="small">verifies signatures</text><path d="M1010 265L1220 265" class="line" marker-end="url(#arrow)"/><rect x="1220" y="170" width="300" height="190" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="1248" y="216" class="label">ADDRESS</text><text x="1248" y="252" class="small">shareable</text><text x="1248" y="279" class="small">protocol-specific</text><rect x="650" y="500" width="360" height="190" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="678" y="546" class="label">TRANSACTION DATA</text><text x="678" y="582" class="small">destination</text><text x="678" y="609" class="small">amount / inputs / call</text><path d="M1010 595L1220 595" class="red" marker-end="url(#arrowRed)"/><rect x="1220" y="500" width="300" height="190" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="1248" y="546" class="label">SIGNATURE</text><text x="1248" y="582" class="small">publicly verifiable</text><text x="1248" y="609" class="small">bound to the data</text><path d="M245 490V710H1220" fill="none" stroke="#d3492f" stroke-width="3" stroke-dasharray="10 10"/><text x="80" y="780" class="body">The private key is never sent to the network. Only public data and signatures are published.</text></svg>