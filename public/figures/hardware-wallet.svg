<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Hardware wallet transaction flow</title><desc id="desc">The host builds and broadcasts while a dedicated device parses, displays, confirms, and signs.</desc><rect width="1600" height="900" fill="#e8e1d4"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker><marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#171713}.title{font-size:56px;font-weight:760;letter-spacing:-2px}.label{font-size:26px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#625e56}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;fill:#d3492f}.line{fill:none;stroke:#171713;stroke-width:3}.red{fill:none;stroke:#d3492f;stroke-width:5}</style><text x="70" y="100" class="title">Hardware wallet: split the transaction path</text><rect x="60" y="180" width="690" height="590" fill="none" stroke="#a49b8d" stroke-width="3"/><text x="90" y="220" class="mono">ONLINE HOST · UNTRUSTED</text><rect x="95" y="285" width="260" height="170" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="123" y="331" class="label">BUILD</text><text x="123" y="367" class="small">chain state</text><text x="123" y="394" class="small">unsigned operation</text><rect x="455" y="535" width="250" height="170" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="483" y="581" class="label">BROADCAST</text><text x="483" y="617" class="small">signed transaction</text><text x="483" y="644" class="small">to the network</text><rect x="850" y="180" width="690" height="590" fill="none" stroke="#d3492f" stroke-width="4"/><text x="880" y="220" class="mono" fill="#d3492f">DEDICATED SIGNER · TRUSTED REVIEW</text><rect x="885" y="275" width="190" height="155" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="913" y="321" class="label">PARSE</text><text x="913" y="357" class="small">actual bytes</text><rect x="1130" y="275" width="190" height="155" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="1158" y="321" class="label">DISPLAY</text><text x="1158" y="357" class="small">human meaning</text><rect x="1375" y="275" width="130" height="155" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="1403" y="321" class="label">CONFIRM</text><text x="1403" y="357" class="small">physical</text><rect x="1130" y="535" width="190" height="155" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="1158" y="581" class="label">SIGN</text><text x="1158" y="617" class="small">derived key</text><path d="M355 370L850 370" class="red" marker-end="url(#arrowRed)"/><text x="530" y="335" class="small">unsigned request</text><path d="M1075 352L1130 352" class="red" marker-end="url(#arrowRed)"/><path d="M1320 352L1375 352" class="red" marker-end="url(#arrowRed)"/><path d="M1440 430V612H1320" class="red" marker-end="url(#arrowRed)"/><path d="M1130 612H705" class="red" marker-end="url(#arrowRed)"/><text x="790" y="580" class="small">signature / signed artifact</text><text x="90" y="735" class="small">Network access and rich UI stay here.</text><text x="880" y="735" class="small">Keys and final approval stay behind a narrower boundary.</text><text x="70" y="835" class="body">The host proposes and broadcasts. The signer independently interprets and authorizes.</text></svg>