<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hardening a hardware wallet one boundary at a time</title>
  <desc id="desc">Five stages progress from an unsafe software signer to semantic transaction parsing, trusted review, isolated secure execution, a hardware security root, and verified boot.</desc>
  <rect width="960" height="540" fill="#e8e1d4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="54" y="54" font-size="13" font-weight="700" letter-spacing="1.4" fill="#171713">HARDENING LADDER</text>
    <text x="906" y="54" text-anchor="end" font-size="11" fill="#5d5a52">authority narrows →</text>
  </g>
  <line x1="54" y1="78" x2="906" y2="78" stroke="#171713" stroke-width="1"/>

  <g transform="translate(54 112)">
    <rect width="150" height="326" fill="#f2eee4" stroke="#777168"/>
    <rect x="0" y="0" width="150" height="8" fill="#d3492f"/>
    <text x="16" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#9e2c19">00 / UNSAFE</text>
    <text x="16" y="82" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">Software</text>
    <text x="16" y="108" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">signer</text>
    <text x="16" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">host owns</text>
    <text x="16" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">memory + UI</text>
    <line x1="16" y1="210" x2="134" y2="210" stroke="#bdb5a7"/>
    <text x="16" y="242" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">malware can copy</text>
    <text x="16" y="262" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">the key or replace</text>
    <text x="16" y="282" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">the transaction</text>
  </g>

  <g transform="translate(224 112)">
    <rect width="150" height="326" fill="#f2eee4" stroke="#777168"/>
    <rect x="0" y="0" width="150" height="8" fill="#3e6d9c"/>
    <text x="16" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#3e6d9c">01 / SEMANTIC</text>
    <text x="16" y="82" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">Parse the</text>
    <text x="16" y="108" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">operation</text>
    <text x="16" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">PSBT / typed</text>
    <text x="16" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">request</text>
    <line x1="16" y1="210" x2="134" y2="210" stroke="#bdb5a7"/>
    <text x="16" y="242" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">device derives</text>
    <text x="16" y="262" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">what the bytes</text>
    <text x="16" y="282" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">actually mean</text>
  </g>

  <g transform="translate(394 112)">
    <rect width="150" height="326" fill="#f2eee4" stroke="#777168"/>
    <rect x="0" y="0" width="150" height="8" fill="#c88926"/>
    <text x="16" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#8a5a14">02 / REVIEW</text>
    <text x="16" y="82" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">Trusted</text>
    <text x="16" y="108" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">display</text>
    <text x="16" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">same object</text>
    <text x="16" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">review + sign</text>
    <line x1="16" y1="210" x2="134" y2="210" stroke="#bdb5a7"/>
    <text x="16" y="242" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">physical approval</text>
    <text x="16" y="262" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">binds human intent</text>
    <text x="16" y="282" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">to that object</text>
  </g>

  <g transform="translate(564 112)">
    <rect width="150" height="326" fill="#f2eee4" stroke="#777168"/>
    <rect x="0" y="0" width="150" height="8" fill="#627d45"/>
    <text x="16" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#4a6234">03 / ISOLATE</text>
    <text x="16" y="82" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">Secure</text>
    <text x="16" y="108" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#171713">world</text>
    <text x="16" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">USB ≠ secret</text>
    <text x="16" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#5d5a52">memory</text>
    <line x1="16" y1="210" x2="134" y2="210" stroke="#bdb5a7"/>
    <text x="16" y="242" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">least privilege</text>
    <text x="16" y="262" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">limits firmware</text>
    <text x="16" y="282" font-family="ui-sans-serif, system-ui" font-size="13" fill="#171713">blast radius</text>
  </g>

  <g transform="translate(734 112)">
    <rect width="172" height="326" fill="#171713" stroke="#171713"/>
    <rect x="0" y="0" width="172" height="8" fill="#7f9b5b"/>
    <text x="16" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#b8d18d">04 / HARDWARE ROOT</text>
    <text x="16" y="82" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#f2eee4">Protected</text>
    <text x="16" y="108" font-family="ui-sans-serif, system-ui" font-size="23" font-weight="700" fill="#f2eee4">secrets</text>
    <text x="16" y="156" font-family="ui-monospace, monospace" font-size="12" fill="#bdb5a7">key wrapping</text>
    <text x="16" y="176" font-family="ui-monospace, monospace" font-size="12" fill="#bdb5a7">counters / boot</text>
    <line x1="16" y1="210" x2="156" y2="210" stroke="#777168"/>
    <text x="16" y="242" font-family="ui-sans-serif, system-ui" font-size="13" fill="#f2eee4">verified firmware</text>
    <text x="16" y="262" font-family="ui-sans-serif, system-ui" font-size="13" fill="#f2eee4">+ anti-rollback</text>
    <text x="16" y="282" font-family="ui-sans-serif, system-ui" font-size="13" fill="#f2eee4">protect the policy</text>
  </g>

  <g stroke="#171713" stroke-width="1.5" fill="none">
    <path d="M204 275h20"/>
    <path d="M374 275h20"/>
    <path d="M544 275h20"/>
    <path d="M714 275h20"/>
  </g>
  <g fill="#171713">
    <path d="M222 271l7 4-7 4z"/>
    <path d="M392 271l7 4-7 4z"/>
    <path d="M562 271l7 4-7 4z"/>
    <path d="M732 271l7 4-7 4z"/>
  </g>

  <line x1="54" y1="470" x2="906" y2="470" stroke="#171713" stroke-width="1"/>
  <text x="54" y="500" font-family="ui-monospace, monospace" font-size="11" fill="#5d5a52">NO SINGLE STAGE IS “THE SECURITY FEATURE” — THE CLAIM COMES FROM THE COMPOSITION.</text>
</svg>