<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Software wallet transaction flow</title><desc id="desc">Networking, transaction construction, review, private-key access, signing, and broadcast occur on one general-purpose device.</desc>
<rect width="1600" height="900" fill="#e8e1d4"/>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker>
  <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker>
</defs>
<style>
text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#171713}
.title{font-size:56px;font-weight:760;letter-spacing:-2px} .label{font-size:26px;font-weight:700} .body{font-size:21px} .small{font-size:17px;fill:#625e56} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px} .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;fill:#d3492f}
.line{fill:none;stroke:#171713;stroke-width:3} .red{fill:none;stroke:#d3492f;stroke-width:5}
</style><text x="70" y="100" class="title">Software wallet: one host, one trust domain</text><rect x="60" y="180" width="1480" height="590" fill="none" stroke="#d3492f" stroke-width="4" stroke-dasharray="14 10"/><text x="90" y="220" class="mono" fill="#d3492f">PHONE / BROWSER / COMPUTER</text><text x="90" y="330" class="num">1</text><rect x="90" y="355" width="200" height="185" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="118" y="401" class="label">READ STATE</text><text x="118" y="437" class="small">node / RPC</text><path d="M290 448L325 448" class="line" marker-end="url(#arrow)"/><text x="335" y="330" class="num">2</text><rect x="335" y="355" width="200" height="185" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="363" y="401" class="label">BUILD</text><text x="363" y="437" class="small">unsigned tx</text><path d="M535 448L570 448" class="line" marker-end="url(#arrow)"/><text x="580" y="330" class="num">3</text><rect x="580" y="355" width="200" height="185" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="608" y="401" class="label">REVIEW</text><text x="608" y="437" class="small">host screen</text><path d="M780 448L815 448" class="red" marker-end="url(#arrowRed)"/><text x="825" y="330" class="num">4</text><rect x="825" y="355" width="200" height="185" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="853" y="401" class="label">UNLOCK</text><text x="853" y="437" class="small">local key store</text><path d="M1025 448L1060 448" class="red" marker-end="url(#arrowRed)"/><text x="1070" y="330" class="num">5</text><rect x="1070" y="355" width="200" height="185" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="1098" y="401" class="label">SIGN</text><text x="1098" y="437" class="small">private key</text><path d="M1270 448L1305 448" class="red" marker-end="url(#arrowRed)"/><text x="1315" y="330" class="num">6</text><rect x="1315" y="355" width="200" height="185" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="1343" y="401" class="label">BROADCAST</text><text x="1343" y="437" class="small">signed tx</text><text x="90" y="650" class="label">Convenient</text><text x="90" y="690" class="small">The same application can do everything.</text><text x="800" y="650" class="label">Shared failure domain</text><text x="800" y="690" class="small">Malware may influence both what is shown and how keys are used.</text></svg>