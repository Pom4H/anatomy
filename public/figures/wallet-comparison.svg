<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Software and hardware wallet trust boundaries</title><desc id="desc">Side-by-side comparison of where review and signing happen.</desc><rect width="1600" height="900" fill="#e8e1d4"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#171713"/></marker><marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#d3492f"/></marker></defs><style>text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#171713}.title{font-size:56px;font-weight:760;letter-spacing:-2px}.label{font-size:26px;font-weight:700}.body{font-size:21px}.small{font-size:17px;fill:#625e56}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;letter-spacing:1px}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;fill:#d3492f}.line{fill:none;stroke:#171713;stroke-width:3}.red{fill:none;stroke:#d3492f;stroke-width:5}</style><text x="70" y="100" class="title">Same result, different trust boundary</text><text x="70" y="190" class="num">SOFTWARE WALLET</text><text x="830" y="190" class="num">HARDWARE WALLET</text><rect x="60" y="220" width="690" height="480" fill="none" stroke="#171713" stroke-width="2"/><rect x="95" y="280" width="250" height="150" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="123" y="326" class="label">HOST UI</text><text x="123" y="362" class="small">review</text><rect x="460" y="280" width="250" height="150" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="488" y="326" class="label">HOST KEY STORE</text><text x="488" y="362" class="small">sign</text><path d="M345 355L460 355" class="red" marker-end="url(#arrowRed)"/><rect x="275" y="500" width="260" height="130" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="303" y="546" class="label">NETWORK</text><text x="303" y="582" class="small">broadcast</text><path d="M585 430L470 500" class="line" marker-end="url(#arrow)"/><text x="95" y="665" class="small">Review and key use share the host.</text><rect x="820" y="220" width="720" height="480" fill="none" stroke="#171713" stroke-width="2"/><rect x="855" y="280" width="230" height="150" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="883" y="326" class="label">HOST</text><text x="883" y="362" class="small">build + network</text><rect x="1240" y="260" width="250" height="190" rx="2" fill="#f7f3ea" stroke="#d3492f" stroke-width="3"/><text x="1268" y="306" class="label">SIGNER</text><text x="1268" y="342" class="small">trusted display</text><text x="1268" y="369" class="small">physical approval</text><text x="1268" y="396" class="small">private key</text><path d="M1085 355L1240 355" class="red" marker-end="url(#arrowRed)"/><path d="M1240 430L1085 520" class="red" marker-end="url(#arrowRed)"/><rect x="855" y="500" width="230" height="130" rx="2" fill="#f7f3ea" stroke="#171713" stroke-width="2"/><text x="883" y="546" class="label">HOST</text><text x="883" y="582" class="small">broadcast</text><line x1="1160" y1="235" x2="1160" y2="620" stroke="#d3492f" stroke-width="3" stroke-dasharray="10 10"/><text x="1178" y="250" class="small">trust boundary</text><text x="855" y="665" class="small">The host proposes; the signer independently authorizes.</text><text x="70" y="815" class="body">Both produce protocol-valid signatures. Hardware reduces how much the networked host must be trusted.</text></svg>